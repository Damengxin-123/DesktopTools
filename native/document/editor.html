<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src qrc:; style-src qrc: 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>文档编辑器</title>
  <link rel="stylesheet" href="editor.css">
  <script defer src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script defer src="editor.js"></script>
</head>
<body>
  <header class="top">
    <div class="identity"><span class="mark" aria-hidden="true">▤</span><span><strong>文档编辑器</strong><small>DESKTOP TOOL / HTML DOCUMENT</small></span></div>
    <div class="meta">
      <input id="title" type="text" maxlength="200" placeholder="请输入文档标题" aria-label="文档标题">
      <select id="category" aria-label="文档分类"></select>
      <button id="password" type="button">密码锁：未设置</button>
      <button id="export" type="button">导出文档</button>
      <button id="save" class="primary" type="button">保存 <kbd>Ctrl+S</kbd></button>
    </div>
  </header>
  <div id="toolbar" class="toolbar" role="toolbar" aria-label="文档格式">
    <div class="group">
      <button type="button" data-command="undo" title="撤销（Ctrl+Z）">↶ 撤销</button>
      <button type="button" data-command="redo" title="重做（Ctrl+Y）">↷ 重做</button>
    </div>
    <div class="group">
      <select data-command="formatBlock" aria-label="段落样式">
        <option value="" selected disabled>段落样式</option><option value="p">正文</option><option value="h1">标题 1</option><option value="h2">标题 2</option><option value="h3">标题 3</option><option value="blockquote">引用</option>
      </select>
      <select data-command="fontName" aria-label="字体">
        <option value="" selected disabled>字体</option><option value="Microsoft YaHei">微软雅黑</option><option value="SimSun">宋体</option><option value="SimHei">黑体</option><option value="KaiTi">楷体</option><option value="Arial">Arial</option><option value="Times New Roman">Times New Roman</option>
      </select>
      <select data-command="fontSize" aria-label="字号">
        <option value="" selected disabled>字号</option><option value="1">极小</option><option value="2">小</option><option value="3">正文</option><option value="4">中</option><option value="5">大</option><option value="6">特大</option><option value="7">标题</option>
      </select>
      <button type="button" data-command="bold" data-toggle title="加粗（Ctrl+B）" aria-label="加粗"><b>B</b></button>
      <button type="button" data-command="italic" data-toggle title="斜体（Ctrl+I）" aria-label="斜体"><i>I</i></button>
      <button type="button" data-command="underline" data-toggle title="下划线（Ctrl+U）" aria-label="下划线"><u>U</u></button>
      <button type="button" data-command="strikeThrough" data-toggle title="删除线" aria-label="删除线"><s>S</s></button>
      <label class="color" title="字体颜色">字色 <input type="color" data-command="foreColor" value="#9a6224" aria-label="字体颜色"></label>
      <button type="button" data-command="removeFormat">清除格式</button>
    </div>
    <div class="group">
      <button type="button" data-command="justifyLeft" data-toggle>左对齐</button>
      <button type="button" data-command="justifyCenter" data-toggle>居中</button>
      <button type="button" data-command="justifyRight" data-toggle>右对齐</button>
      <button type="button" data-command="insertOrderedList" data-toggle>编号</button>
      <button type="button" data-command="insertUnorderedList" data-toggle>项目符号</button>
    </div>
    <div class="group">
      <button id="table" type="button">插入表格</button>
      <button id="image" type="button">插入图片</button>
      <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
    </div>
  </div>
  <main class="workspace">
    <aside class="outline-panel" aria-label="段落导航"><h2>段落导航</h2><p class="hint">显示已编号的段落</p><nav id="outline"></nav></aside>
    <section class="document-scroll">
    <article id="editor" class="paper" contenteditable="false" role="textbox" aria-multiline="true" aria-label="文档正文" data-placeholder="从这里开始撰写…"></article>
    </section>
    <aside class="styles-panel" aria-label="字体样式预设"><h2>字体样式</h2><p class="hint">整段应用，或只修改选中文字</p><select id="style-scope" aria-label="样式应用范围"><option value="paragraph">应用到所在段落</option><option value="selection">应用到选中文字</option></select><div id="styles"></div><button id="edit-styles" type="button">配置样式预设</button></aside>
  </main>
  <footer><span id="status" role="status">正在加载文档…</span><span>.DaDocH 文档 · Ctrl+S 保存</span></footer>
  <dialog id="table-dialog">
    <form method="dialog">
      <h2>插入表格</h2>
      <p>设置行数和列数，插入后点击单元格输入内容。</p>
      <div class="dimensions">
        <label>行数 <input id="table-rows" type="number" min="1" max="30" value="3" required></label>
        <label>列数 <input id="table-columns" type="number" min="1" max="12" value="3" required></label>
      </div>
      <div class="dialog-actions"><button id="table-cancel" type="button">取消</button><button class="primary" type="submit">插入表格</button></div>
    </form>
  </dialog>
  <dialog id="styles-dialog"><form method="dialog"><h2>配置字体样式</h2><label>预设 <select id="preset-index"></select></label><label>名称 <input id="preset-name" maxlength="30" required></label><label>字体 <select id="preset-font"><option>微软雅黑</option><option>宋体</option><option>黑体</option><option>楷体</option><option>Arial</option><option>Times New Roman</option></select></label><label>字号 <select id="preset-size"><option value="2">小</option><option value="3">正文</option><option value="4">中</option><option value="5">大</option><option value="6">特大</option><option value="7">标题</option></select></label><label><input id="preset-bold" type="checkbox">加粗</label><label><input id="preset-italic" type="checkbox">斜体</label><label><input id="preset-use-color" type="checkbox">指定字色</label><input id="preset-color" type="color" value="#9a6224" aria-label="预设字色"><div class="dialog-actions"><button type="button" id="styles-cancel">取消</button><button class="primary" type="submit">保存预设</button></div></form></dialog>
</body>
</html>
